[package]
name = "serialporttool"
version = "0.1.3"
description = "跨平台串口、TCP/UDP 调试与协议分析工具"
authors = ["SerialPortTool contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "serialporttool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# This crate keeps its executable behavior covered by unit/integration tests;
# there are no public API doctest examples to compile.
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.9.0"
