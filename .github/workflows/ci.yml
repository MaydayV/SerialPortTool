name: 主分支持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Tauri Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev pkg-config

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 准备 MCP sidecar
        env:
          MCP_SIDECAR_TARGET: x86_64-unknown-linux-gnu
        run: npm run prepare:mcp-sidecar

      - name: 前端协议测试
        run: npm test

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust 格式检查
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust 静态检查
        working-directory: src-tauri
        run: cargo check --all-targets --all-features

      - name: Rust Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust 测试（含集成测试）
        working-directory: src-tauri
        run: cargo test --all-targets --all-features -- --test-threads=1
