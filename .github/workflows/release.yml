name: 自动编译发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 创建/复用 Release 草稿（只负责元数据，不在这里编译）
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本与 Tag
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "使用版本: ${VERSION}，Tag: ${TAG}"

      - name: 创建或复用 Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          API="repos/${GITHUB_REPOSITORY}"
          RELEASE_ID=$(gh api "${API}/releases/tags/${TAG_NAME}" --jq '.id' 2>/dev/null || true)
          if [ -z "${RELEASE_ID}" ]; then
            RELEASE_ID=$(gh api "${API}/releases" --method POST \
              -f "tag_name=${TAG_NAME}" \
              -f "target_commitish=${GITHUB_SHA}" \
              -f "name=SerialPortTool ${VERSION}" \
              -f "body=跨平台串口调试助手自动编译产物。请根据平台下载对应安装包。" \
              -F "draft=true" -F "prerelease=false" --jq '.id')
            echo "已创建 Release: ${RELEASE_ID}"
          else
            echo "复用已有 Release: ${RELEASE_ID}"
          fi
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  # 三平台矩阵编译
  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (M 系列)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel Mac
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev pkg-config

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装前端依赖
        run: npm ci

      - name: 编译并上传安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 使用 create-release 明确输出的 Release ID，避免矩阵任务找不到 draft Release
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
