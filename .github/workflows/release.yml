name: 自动编译发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 只创建 Release 草稿；所有安装包成功后才允许 publish-release 公开发布。
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本与 Tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "使用版本: ${VERSION}，Tag: ${TAG}"

      - name: 确保 Tag 存在
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          API="repos/${GITHUB_REPOSITORY}"
          if ! gh api "${API}/git/ref/tags/${TAG_NAME}" >/dev/null 2>&1; then
            gh api "${API}/git/refs" --method POST \
              -f "ref=refs/tags/${TAG_NAME}" \
              -f "sha=${GITHUB_SHA}" >/dev/null
            echo "已创建 Tag: ${TAG_NAME}"
          else
            echo "Tag 已存在: ${TAG_NAME}"
          fi

      - name: 创建或复用 Release 草稿
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          API="repos/${GITHUB_REPOSITORY}"
          RELEASE_RESPONSE=$(gh api "${API}/releases/tags/${TAG_NAME}" 2>/dev/null || true)
          RELEASE_ID=$(printf '%s' "${RELEASE_RESPONSE}" | jq -r '.id // empty')
          if [ -z "${RELEASE_ID}" ]; then
            RELEASE_ID=$(gh api "${API}/releases" --method POST \
              -f "tag_name=${TAG_NAME}" \
              -f "target_commitish=${GITHUB_SHA}" \
              -f "name=SerialPortTool ${VERSION}" \
              -f "body=跨平台串口调试助手自动编译产物。请根据平台下载对应安装包。" \
              -F "draft=true" -F "prerelease=false" --jq '.id')
            echo "已创建 Release 草稿: ${RELEASE_ID}"
          else
            RELEASE_DRAFT=$(printf '%s' "${RELEASE_RESPONSE}" | jq -r '.draft // false')
            if [ "${RELEASE_DRAFT}" != "true" ]; then
              echo "Release ${TAG_NAME} 已经正式发布，拒绝覆盖已有正式版本；请提升 package.json 版本后再发布。" >&2
              exit 1
            fi
            echo "复用已有 Release 草稿: ${RELEASE_ID}"
          fi
          # 复用旧 Release 时也强制回到草稿，禁止半成品被公开看到。
          gh api "${API}/releases/${RELEASE_ID}" --method PATCH \
            -F "draft=true" -F "prerelease=false" >/dev/null
          echo "Release 保持 draft=true"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  # 四个平台构建全部成功后，publish-release 才会运行。
  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (M 系列)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel Mac
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev pkg-config

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装前端依赖
        run: npm ci

      - name: 编译并上传安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag_name }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build-tauri]
    if: ${{ needs.build-tauri.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 发布完整 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          API="repos/${GITHUB_REPOSITORY}"
          gh api "${API}/releases/${RELEASE_ID}" --method PATCH \
            -F "draft=false" -F "prerelease=false" >/dev/null
          DRAFT=$(gh api "${API}/releases/${RELEASE_ID}" --jq '.draft')
          test "${DRAFT}" = "false"
          echo "Release ${RELEASE_ID} 已在四个平台构建成功后公开发布"
